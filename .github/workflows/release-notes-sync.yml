name: Release Notes Sync

on:
  push:
    branches: [main]
    paths:
      - CHANGELOG.md

concurrency:
  group: release-notes-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Read release notes
        id: release
        env:
          RELEASE_NOTES_PATH: ${{ runner.temp }}/release-notes.md
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/release-metadata.mjs "v${version}" "$RELEASE_NOTES_PATH"

      - name: Update existing GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES_PATH: ${{ runner.temp }}/release-notes.md
          RELEASE_TAG: v${{ steps.release.outputs.version }}
        run: node scripts/sync-release-notes.mjs
