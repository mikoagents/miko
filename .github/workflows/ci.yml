name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Replace this marker with the accepted companion commit immediately after the
# companion PR creator commits it. Source-built jobs deliberately fail until it
# is one exact 40-character SHA; mutable refs and repository variables are forbidden.
env:
  MIKO_E2E_COMMIT: a3fbf9cb159aa9560b4bb8ac9d6df87bb8f3f925

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check Docker build definition
        run: docker build --check .

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RUN_RUNG_E_E2E: ${{ vars.RUN_RUNG_E_E2E }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install E2E agent CLIs
        run: npm install -g @getpaseo/cli opencode-ai

      - name: Run tests
        run: npm test

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Check Drizzle migrations for drift
        run: npm run db:check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Build production application
        run: npm run build

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MIKO_E2E_WORKTREE: ${{ github.workspace }}/miko-source
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Require the exact Miko companion commit
        run: |
          [[ "$MIKO_E2E_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Fill MIKO_E2E_COMMIT with the accepted companion commit before review"
            exit 1
          }

      - name: Check out exact Miko source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: mikoagents/miko-daemon
          ref: ${{ env.MIKO_E2E_COMMIT }}
          path: miko-source

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Build exact Miko source
        working-directory: miko-source
        run: |
          npm ci
          npm run build:miko

      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run built-app browser tests
        run: npm run test:e2e:browser

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build and smoke-test production image
        run: npm run docker:smoke

  hub-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MIKO_E2E_WORKTREE: ${{ github.workspace }}/miko-source
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Require the exact Miko companion commit
        run: |
          [[ "$MIKO_E2E_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Fill MIKO_E2E_COMMIT with the accepted companion commit before review"
            exit 1
          }

      - name: Check out exact Miko source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: mikoagents/miko-daemon
          ref: ${{ env.MIKO_E2E_COMMIT }}
          path: miko-source

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Build exact Miko source
        working-directory: miko-source
        run: |
          npm ci
          npm run build:miko

      - name: Install Hub dependencies
        run: npm ci

      - name: Install provider CLIs for bundle validation
        run: npm install -g @anthropic-ai/claude-code@2.1.226 @openai/codex@0.144.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Hub production application
        run: npm run build

      - name: Run Hub E2E against source-built Miko
        run: npm run test:e2e:hub:source
