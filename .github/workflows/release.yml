name: Release
run-name: ${{ inputs.checks_only && 'Validate release' || 'Release' }} ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      checks_only:
        description: Validate main without publishing an image or release
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a release tag on main, or main for checks only
        env:
          CHECKS_ONLY: ${{ inputs.checks_only || false }}
        run: |
          set -euo pipefail
          if [[ "$CHECKS_ONLY" == true ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo '::error::Run checks-only validation from main'; exit 1; }
          else
            [[ "$GITHUB_REF" == refs/tags/v* ]] || { echo '::error::Run Release from a vX.Y.Z tag'; exit 1; }
          fi
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - name: Validate version, lockfile and changelog
        id: release
        env:
          RELEASE_NOTES_PATH: ${{ runner.temp }}/release-notes.md
          CHECKS_ONLY: ${{ inputs.checks_only || false }}
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ "$CHECKS_ONLY" == true ]]; then
            tag="v$(node -p "require('./package.json').version")"
          fi
          node scripts/release-metadata.mjs "$tag" "$RELEASE_NOTES_PATH"

  ci-proof:
    name: Verify main CI for this commit
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: read
      contents: read
    outputs:
      run_checks: ${{ steps.ci.outputs.run_checks }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Reuse or wait for the exact main CI
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-ci.mjs

  checks:
    name: Release checks
    needs: [metadata, ci-proof]
    if: needs.ci-proof.outputs.run_checks == 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Publish GHCR image and GitHub Release
    needs: [metadata, ci-proof, checks]
    if: >-
      always() && !cancelled() && !inputs.checks_only &&
      needs.metadata.result == 'success' && needs.ci-proof.result == 'success' &&
      (needs.checks.result == 'success' ||
       (needs.checks.result == 'skipped' && needs.ci-proof.outputs.run_checks == 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Read validated release metadata
        id: release
        env:
          RELEASE_NOTES_PATH: ${{ runner.temp }}/release-notes.md
        run: node scripts/release-metadata.mjs "$GITHUB_REF_NAME" "$RELEASE_NOTES_PATH"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish release image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.image_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES_PATH: ${{ runner.temp }}/release-notes.md
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE: ${{ steps.release.outputs.image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          printf '\nContainer: %s@%s\n' "$IMAGE" "$IMAGE_DIGEST" >> "$RELEASE_NOTES_PATH"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file "$RELEASE_NOTES_PATH"
            exit 0
          fi

          args=(--verify-tag --title "Miko Hub $RELEASE_TAG" --notes-file "$RELEASE_NOTES_PATH")
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}"
